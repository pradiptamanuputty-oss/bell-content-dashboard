<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell — Jadwal Upload</title>
<style>
  :root {
    --bg: #0b0e13;
    --card: #141922;
    --border: #232b3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #8b7cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(11,14,19,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  header .inner { max-width: 680px; margin: 0 auto; padding: 12px 16px; }
  .brand { font-weight: 700; letter-spacing: .08em; font-size: 13px; color: var(--accent); }
  .brand span { color: var(--text); letter-spacing: 0; margin-left: 6px; font-weight: 600; }
  .datebar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .datebar input[type=date] {
    flex: 1; min-width: 0; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    font: inherit; color-scheme: dark;
  }
  .datebar button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer;
  }
  .datebar button:hover { border-color: var(--accent); color: var(--accent); }
  #today { background: var(--accent); border-color: var(--accent); color: #0b0e13; font-weight: 600; }
  #today:hover { opacity: .85; color: #0b0e13; }
  .daylabel { margin: 18px 0 6px; font-weight: 600; font-size: 16px; }
  #summary { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .client { margin: 18px 0 10px; font-weight: 700; font-size: 13px; text-transform: uppercase;
            letter-spacing: .06em; color: var(--accent);
            display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .epbtn {
    font-size: 11.5px; font-weight: 500; letter-spacing: .02em; text-transform: none;
    color: var(--muted); border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 9px; text-decoration: none; white-space: nowrap;
  }
  .epbtn:hover { border-color: var(--accent); color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pill {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .pill.platform { color: var(--text); border-color: #3a4660; }
  .st-0 { color: #22c55e; border-color: #1d4d33; }   /* aired */
  .st-1 { color: #3b82f6; border-color: #1e3a5f; }   /* ready */
  .st-2 { color: #f59e0b; border-color: #4a3a12; }   /* preview/acc */
  .st-3 { color: #ef4444; border-color: #4a2020; }   /* revision */
  .st-4 { color: #94a3b8; }                          /* production */
  .st-9 { color: #64748b; }                          /* kosong */
  .judul { font-weight: 600; font-size: 20px; line-height: 1.35; margin: 0 0 4px; }
  .field { margin-top: 12px; }
  .flabel {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 3px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .rawlink {
    color: var(--accent); text-decoration: none; font-size: 13px;
    word-break: break-all; line-height: 1.5;
  }
  .rawlink:hover { text-decoration: underline; }
  .filechip { font-size: 13px; color: var(--muted); word-break: break-all; line-height: 1.5; }
  .captext {
    white-space: pre-wrap; word-break: break-word; font-size: 13.5px;
    line-height: 1.6; color: var(--text);
  }
  .copy {
    background: none; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 9px; font: inherit; font-size: 11.5px;
    cursor: pointer; white-space: nowrap; letter-spacing: 0; text-transform: none;
    font-weight: 500;
  }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .copy.ok { color: #22c55e; border-color: #1d4d33; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .empty b { color: var(--text); }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; text-align: center; }
  #unsched { margin-top: 26px; }
  #unsched h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body>
<header><div class="inner">
  <div class="brand">BELL<span>Jadwal Upload</span></div>
  <div class="datebar">
    <button id="prev" aria-label="sebelumnya">‹</button>
    <input type="date" id="pick">
    <button id="next" aria-label="berikutnya">›</button>
    <button id="today">Hari ini</button>
  </div>
</div></header>
<div class="wrap">
  <div class="daylabel" id="daylabel"></div>
  <div id="summary"></div>
  <div id="list"></div>
  <div id="unsched"></div>
  <footer id="foot">memuat data…</footer>
</div>
<script>
"use strict";
const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const $ = id => document.getElementById(id);

function wibISO(d) {
  const t = new Date(d.getTime() + 7 * 3600e3); // geser ke WIB lalu ambil komponen UTC
  return t.toISOString().slice(0, 10);
}
function shiftISO(iso, delta) {
  const d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + delta);
  return d.toISOString().slice(0, 10);
}
function fmtHari(iso) {
  const d = new Date(iso + "T12:00:00Z");
  return HARI[d.getUTCDay()] + ", " + d.getUTCDate() + " " + BULAN[d.getUTCMonth()] + " " + d.getUTCFullYear();
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function stClass(status) {
  const s = (status || "").toLowerCase();
  if (s.includes("uploaded") || s.includes("scheduled")) return "st-0";
  if (s.includes("ready") || s.includes("approved")) return "st-1";
  if (s.includes("preview") || s.includes("acc")) return "st-2";
  if (s.includes("revision")) return "st-3";
  if (s.includes("production") || s.includes("asset ready")) return "st-4";
  return "st-9";
}
function extractLinks(cell) {
  const urls = String(cell || "").match(/https?:\/\/[^\s"'<>]+/g) || [];
  const txt = String(cell || "").trim();
  return { urls, text: txt };
}

let DATA = null;
let current = wibISO(new Date());

function fieldLinks(cell, label) {
  const { urls, text } = extractLinks(cell);
  let body;
  if (urls.length) {
    body = urls.map(u =>
      `<div><a class="rawlink" href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`
    ).join("");
  } else if (text) {
    body = `<div class="filechip">${esc(text)}</div>`;
  } else {
    body = `<div class="filechip">—</div>`;
  }
  const copyVal = urls.join("\n") || text || "";
  const copyBtn = copyVal
    ? `<button class="copy" data-copy="${esc(JSON.stringify(copyVal))}">Salin</button>` : "";
  return `<div class="field"><div class="flabel">${esc(label)} ${copyBtn}</div>${body}</div>`;
}

function epBtn(k) {
  const u = DATA && DATA.clients && DATA.clients[k];
  return u ? `<a class="epbtn" href="${esc(u)}" target="_blank" rel="noopener">Buka EP ↗</a>` : "";
}

function render() {
  const items = DATA.items.filter(i => i.tanggal === current);
  $("daylabel").textContent = fmtHari(current);
  $("pick").value = current;

  const klien = new Set(items.map(i => i.klien));
  $("summary").textContent = items.length
    ? items.length + " konten · " + klien.size + " klien"
    : "Tidak ada konten terjadwal di tanggal ini";

  const groups = {};
  for (const it of items) (groups[it.klien] = groups[it.klien] || []).push(it);

  let h = "";
  for (const k of Object.keys(groups)) {
    h += `<div class="client"><span>${esc(k)}</span>${epBtn(k)}</div>`;
    for (const it of groups[k]) {
      const hasCaption = (it.caption || "").trim().length > 0;
      h += `<div class="card">`;
      h += `<div class="pills">`;
      h += `<span class="pill platform">${esc(it.platform || "—")}</span>`;
      if (it.tipe) h += `<span class="pill">${esc(it.tipe)}</span>`;
      h += `<span class="pill ${stClass(it.status)}">${esc(it.status || "belum ada status")}</span>`;
      h += `</div>`;
      if (it.judul) h += `<p class="judul">${esc(it.judul)}</p>`;
      h += fieldLinks(it.link, "Link Content");
      if (it.cover) h += fieldLinks(it.cover, "Link Cover");
      if (hasCaption) {
        h += `<div class="field"><div class="flabel">Caption ` +
             `<button class="copy" data-copy="${esc(JSON.stringify(it.caption))}">Salin</button>` +
             `</div><div class="captext">${esc(it.caption)}</div></div>`;
      }
      h += `</div>`;
    }
  }
  $("list").innerHTML = h || `<div class="empty"><b>Tidak ada konten</b> untuk ${fmtHari(current)}.</div>`;

  // belum terjadwal — hanya di tampilan hari ini
  const uns = DATA.items.filter(i => !i.tanggal);
  if (current === wibISO(new Date()) && uns.length) {
    const by = {};
    for (const it of uns) (by[it.klien] = by[it.klien] || []).push(it);
    let uh = `<h3>Belum terjadwal (${uns.length})</h3>`;
    for (const k of Object.keys(by)) {
      uh += `<div class="client"><span>${esc(k)}</span>${epBtn(k)}</div>`;
      for (const it of by[k]) {
        uh += `<div class="card"><div class="pills">`;
        uh += `<span class="pill platform">${esc(it.platform || "—")}</span>`;
        if (it.tipe) uh += `<span class="pill">${esc(it.tipe)}</span>`;
        uh += `<span class="pill ${stClass(it.status)}">${esc(it.status || "belum ada status")}</span>`;
        uh += `</div>`;
        if (it.judul) uh += `<p class="judul">${esc(it.judul)}</p>`;
        uh += `</div>`;
      }
    }
    $("unsched").innerHTML = uh;
  } else {
    $("unsched").innerHTML = "";
  }
}

async function init() {
  const r = await fetch("data.json", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  DATA = await r.json();
  const g = DATA.generated_at ? new Date(DATA.generated_at) : null;
  $("foot").textContent = g
    ? "Data diperbarui: " + g.toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB"
    : "Data diperbarui: —";
  render();
}

$("pick").addEventListener("change", e => { current = e.target.value; render(); });
$("prev").addEventListener("click", () => { current = shiftISO(current, -1); render(); });
$("next").addEventListener("click", () => { current = shiftISO(current, 1); render(); });
$("today").addEventListener("click", () => { current = wibISO(new Date()); render(); });

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const t = JSON.parse(btn.dataset.copy);
  const ok = await copyText(t);
  const old = btn.textContent;
  btn.textContent = ok ? "✓ Tersalin" : "Gagal";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1600);
});

init().catch(err => {
  $("list").innerHTML = `<div class="empty">Gagal memuat data (${esc(err.message)}).<br>Coba muat ulang halaman.</div>`;
});
</script>
</body>
</html>
